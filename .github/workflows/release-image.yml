# Publishes the Strix helper image. This workflow does not build oMLX.
name: Release helper image

on:
  release:
    types: [published]
  workflow_dispatch:

# GITHUB_TOKEN is read-only unless the workflow says otherwise.
# packages: write publishes to GHCR. The build action also pushes a
# provenance attestation, which needs the other two.
permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  IMAGE: ghcr.io/audiohacking/omlx-strix-helper

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            printf 'list<<EOF\n%s:%s\n%s:latest\nEOF\n' "$IMAGE" "$tag" "$IMAGE" >> "$GITHUB_OUTPUT"
          else
            printf 'list<<EOF\n%s:sha-%s\nEOF\n' "$IMAGE" "${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
